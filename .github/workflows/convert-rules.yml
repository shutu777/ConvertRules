name: Convert Rules for QX & Loon

on:
  schedule:
    # 每天 UTC 0:00 运行（北京时间 8:00）
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动触发
  push:
    branches: [main]
    paths:
      - 'scripts/convert-rules.py'
      - 'scripts/generate-stash-overrides.py'
      - 'Loon_template.conf'
      - '.github/workflows/convert-rules.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run conversion script
        run: python scripts/convert-rules.py rules

      - name: Generate Stash override checklist
        run: python scripts/generate-stash-overrides.py Loon_template.conf -o stash_overrides.md

      - name: Commit generated files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules/ stash_overrides.md
          git diff --cached --quiet && echo "No changes" || git commit -m "Auto-update converted files $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
